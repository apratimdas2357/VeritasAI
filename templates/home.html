{% extends "base.html" %}
{% block title %}Veritas — Scan{% endblock %}

{% block content %}
<div class="camera-screen" id="captureScreen">

  <video id="cameraFeed" class="camera-feed" autoplay playsinline muted></video>
  <canvas id="captureCanvas" class="visually-hidden"></canvas>

  <div class="camera-scrim-top"></div>
  <div class="camera-scrim-bottom"></div>

  <div class="doc-guide"></div>

  <div class="logo-badge">
    {% include "_logo.html" %}
  </div>

  <div class="capture-overlay">

    <div class="status-card glass-strong" id="statusCard">
      <div class="status-text">
        <div class="count"><span id="shotCount">{{ shots_taken | default(0) }}</span>/<span id="shotTotal">{{ shots_required | default(5) }}</span></div>
        <div class="label">Pictures Clicked</div>
      </div>
      <button type="button" class="history-btn" id="historyBtn" aria-label="View history">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 7V12L15 14" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3.5 9A8.5 8.5 0 1 1 3 13" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
          <path d="M3 5V9H7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <button type="button" class="upload-pill glass" id="uploadBtn">Upload Existing Scans</button>
    <input type="file" id="uploadInput" accept="image/*" multiple class="visually-hidden">

    <div class="controls-row">
      <button type="button" class="glass-icon-btn" id="flashBtn" aria-label="Toggle flash">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 2L4 14H11L10 22L20 9H13L13 2Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>

      <button type="button" class="shutter-btn" id="shutterBtn" aria-label="Capture document"></button>

      <button type="button" class="glass-icon-btn" id="nextBtn" aria-label="Continue">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/camera.js') }}"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    Veritas.initCameraScreen({
      videoId: 'cameraFeed',
      canvasId: 'captureCanvas',
      shutterId: 'shutterBtn',
      flashId: 'flashBtn',
      uploadBtnId: 'uploadBtn',
      uploadInputId: 'uploadInput',
      countId: 'shotCount',
      totalId: 'shotTotal',
      nextBtnId: 'nextBtn',
      nextUrl: "{{ url_for('documents') }}",
      historyBtnId: 'historyBtn',
      historyUrl: "{{ url_for('history') }}"
    });
  });
</script>
{% endblock %}
